<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClimateClaim — evidence-based parametric weather claims</title>
    <meta
      name="description"
      content="ClimateClaim evaluates weather evidence against an explicit policy on GenLayer. Sources can be incomplete or disagree, so the honest outcome is sometimes inconclusive."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
        Applies the stored theme BEFORE first paint.

        Without this, a dark-theme visitor gets a full white flash while React
        boots, because the stylesheet's :root defaults are light. This runs
        synchronously in <head>, so the correct palette is in place for the very
        first frame.

        Kept as plain ES5-compatible JS with no imports: an inline module would
        still be deferred. It mirrors the keys in src/theme/theme.ts and
        src/i18n/index.ts; if those change, this must change with them.
      */
      (function () {
        try {
          var pref = localStorage.getItem("climateclaim.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");

          var loc = localStorage.getItem("climateclaim.locale");
          if (loc === "es" || loc === "fr" || loc === "de" || loc === "en") {
            document.documentElement.setAttribute("lang", loc);
          }
        } catch (e) {
          /* storage blocked: fall back to the stylesheet defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
