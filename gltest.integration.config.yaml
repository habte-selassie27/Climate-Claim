# gltest integration configuration.
#
# Run with: gltest tests/integration/ -v -s
#
# Deploys ClimateClaim to the network named by GLTEST_NETWORK (default
# studionet) and exercises the claim lifecycle against real validators.
#
# Reads the deployer key from the environment. Never commit it.
#
# NOTE the scoped artifacts path, for the same reason as gltest.config.yaml:
# gltest clears its artifacts directory on every run, and `artifacts/` holds the
# committed evidence pack.
paths:
  contracts: contracts
  artifacts: artifacts/gltest

networks:
  - name: studionet
    rpc_url: https://studio.genlayer.com/api
    chain_id: 61999
    default_account: deployer